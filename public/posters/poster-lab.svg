<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#FAF3E1"/>
  <!-- Swiss Grid Background Lines -->
  <g stroke="#222222" stroke-width="1" opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
  </g>

  <!-- Large Orange Graphic Block -->
  <rect x="700" y="80" width="420" height="420" fill="#FF6D1F"/>
  <circle cx="910" cy="290" r="140" fill="#FAF3E1" opacity="0.95"/>
  <rect x="850" y="230" width="120" height="120" fill="#222222"/>

  <!-- Swiss Poster Typography -->
  <text x="100" y="180" font-family="'Outfit', 'Space Grotesk', sans-serif" font-weight="900" font-size="110" fill="#222222" letter-spacing="-3">ENTROPY</text>
  <text x="100" y="280" font-family="'Outfit', 'Space Grotesk', sans-serif" font-weight="900" font-size="110" fill="#FF6D1F" letter-spacing="-3">IN THE GRID</text>
  
  <text x="105" y="340" font-family="'Playfair Display', serif" font-style="italic" font-size="36" fill="#222222" opacity="0.8">
    Deconstructing Mid-Century Swiss Typographic Rigor
  </text>

  <!-- Geometric constructivist elements -->
  <rect x="100" y="400" width="480" height="12" fill="#222222"/>
  <rect x="100" y="425" width="280" height="6" fill="#FF6D1F"/>
  
  <g transform="translate(100, 480)">
    <rect width="180" height="240" fill="#F5E7C6" stroke="#222222" stroke-width="2"/>
    <text x="20" y="40" font-family="'DM Mono', monospace" font-size="14" fill="#222222" font-weight="bold">POSTER 01 / 12</text>
    <text x="20" y="70" font-family="'DM Mono', monospace" font-size="11" fill="#FF6D1F">70 × 100 CM</text>
    <text x="20" y="100" font-family="'Geist', sans-serif" font-size="13" fill="#222222" opacity="0.75">
      Silk screen printed on 300gsm Munken Pure rough uncoated paper.
    </text>
    <circle cx="90" cy="180" r="30" fill="#FF6D1F"/>
  </g>

  <g transform="translate(320, 480)">
    <rect width="320" height="240" fill="#222222"/>
    <text x="30" y="50" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="#FAF3E1">
      AKASH KUNDU
    </text>
    <text x="30" y="80" font-family="'DM Mono', monospace" font-size="12" fill="#FF6D1F">
      EXHIBITION // BASEL &amp; KOLKATA
    </text>
    <line x1="30" y1="105" x2="290" y2="105" stroke="#FAF3E1" stroke-width="1" opacity="0.2"/>
    <text x="30" y="140" font-family="'Geist', sans-serif" font-size="14" fill="#FAF3E1" opacity="0.8">
      "Order produces clarity; intentional rupture produces memory."
    </text>
    <text x="30" y="200" font-family="'DM Mono', monospace" font-size="11" fill="#FAF3E1" opacity="0.5">
      COORDINATES: 22.5726° N, 88.3639° E
    </text>
  </g>

  <!-- Bottom Details -->
  <line x1="100" y1="780" x2="1100" y2="780" stroke="#222222" stroke-width="3"/>
  <text x="100" y="820" font-family="'DM Mono', monospace" font-size="14" font-weight="bold" fill="#222222">
    AK. // VISUAL DISCIPLINE 01
  </text>
  <text x="700" y="820" font-family="'DM Mono', monospace" font-size="14" fill="#FF6D1F" font-weight="bold">
    EXPERIMENTAL POSTER &amp; KINETIC TYPE LAB © 2025
  </text>
</svg>