<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#FAF3E1"/>
  <!-- Multi-column grid lines -->
  <g stroke="#222222" stroke-width="1" opacity="0.15">
    <line x1="150" y1="0" x2="150" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="450" y1="0" x2="450" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="750" y1="0" x2="750" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1050" y1="0" x2="1050" y2="900"/>
  </g>
  <!-- Asymmetric Red Block -->
  <rect x="450" y="150" width="450" height="450" fill="#222222"/>
  <rect x="600" y="300" width="300" height="300" fill="#FF6D1F"/>
  <circle cx="600" cy="300" r="100" fill="#FAF3E1"/>
  
  <text x="150" y="240" font-family="'Outfit', sans-serif" font-weight="900" font-size="80" fill="#222222">SWISS</text>
  <text x="150" y="320" font-family="'Outfit', sans-serif" font-weight="900" font-size="80" fill="#FF6D1F">GRID 74</text>
  <text x="150" y="380" font-family="'Playfair Display', serif" font-style="italic" font-size="28" fill="#222222" opacity="0.8">
    Editorial Baseline Matrix
  </text>
  <text x="150" y="780" font-family="'DM Mono', monospace" font-size="14" fill="#222222" font-weight="bold">
    ARCHIVAL STUDY // JOSEF MÜLLER-BROCKMANN SYSTEM
  </text>
</svg>
