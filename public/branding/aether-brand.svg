<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#222222"/>
  
  <!-- Subtle Architectural Grid -->
  <g stroke="#FAF3E1" stroke-width="1" opacity="0.08">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
  </g>

  <!-- Big Æ Monogram & Concentric Golden Circles -->
  <g transform="translate(600, 420)">
    <circle cx="0" cy="0" r="260" fill="none" stroke="#FAF3E1" stroke-width="1" opacity="0.15" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#FF6D1F" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="120" fill="#F5E7C6" opacity="0.1"/>
    <rect x="-80" y="-80" width="160" height="160" fill="none" stroke="#FAF3E1" stroke-width="2"/>
    <text x="0" y="32" font-family="'Outfit', 'Space Grotesk', sans-serif" font-weight="900" font-size="110" fill="#FAF3E1" text-anchor="middle">Æ</text>
  </g>

  <!-- Brand Typography Header -->
  <text x="100" y="140" font-family="'DM Mono', monospace" font-size="14" fill="#FF6D1F" letter-spacing="3">AETHER GENERATIVE MEDIA STUDIO</text>
  <text x="100" y="210" font-family="'Outfit', sans-serif" font-weight="900" font-size="64" fill="#FAF3E1">
    THE ARCHITECTURE OF THOUGHT.
  </text>
  <text x="100" y="260" font-family="'Playfair Display', serif" font-style="italic" font-size="28" fill="#F5E7C6" opacity="0.8">
    Dynamic Identity System &amp; 80-Page Specification Book
  </text>

  <!-- Brand Spec Pills -->
  <g transform="translate(100, 720)">
    <rect width="180" height="60" rx="30" fill="#FF6D1F"/>
    <text x="90" y="36" font-family="'DM Mono', monospace" font-size="13" font-weight="bold" fill="#FAF3E1" text-anchor="middle">#FF6D1F / TANGERINE</text>
  </g>

  <g transform="translate(300, 720)">
    <rect width="180" height="60" rx="30" fill="#F5E7C6"/>
    <text x="90" y="36" font-family="'DM Mono', monospace" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">#F5E7C6 / OATMEAL</text>
  </g>

  <g transform="translate(500, 720)">
    <rect width="180" height="60" rx="30" fill="#FAF3E1"/>
    <text x="90" y="36" font-family="'DM Mono', monospace" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">#FAF3E1 / CANVAS</text>
  </g>

  <text x="1100" y="755" font-family="'DM Mono', monospace" font-size="13" fill="#FAF3E1" opacity="0.6" text-anchor="end">
    DESIGN DIRECTION // AKASH KUNDU 2025
  </text>
</svg>