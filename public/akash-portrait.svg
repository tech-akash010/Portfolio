<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <!-- Halftone Dot Pattern -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#FAF3E1" opacity="0.15"/>
    </pattern>
    <!-- Linear Gradient for Ambient Light -->
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D1F" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#222222" stop-opacity="1"/>
      <stop offset="100%" stop-color="#222222" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#warmLight)"/>
  <rect width="800" height="1000" fill="url(#halftone)"/>

  <!-- Architectural Background Grid -->
  <g stroke="#FAF3E1" stroke-width="1" opacity="0.08">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
  </g>

  <!-- Giant Ambient Halo -->
  <circle cx="400" cy="460" r="280" fill="#FF6D1F" opacity="0.18"/>
  <circle cx="400" cy="460" r="220" fill="#F5E7C6" opacity="0.08"/>

  <!-- Stylized Geometric Portrait Silhouette of Akash Kundu -->
  <!-- Torso & Shoulders -->
  <path d="M 220 900 C 220 720, 290 660, 400 660 C 510 660, 580 720, 580 900 Z" fill="#F5E7C6" opacity="0.95"/>
  <path d="M 330 660 L 400 750 L 470 660 Z" fill="#222222" opacity="0.2"/>

  <!-- Neck -->
  <rect x="360" y="520" width="80" height="150" fill="#FAF3E1" rx="10"/>

  <!-- Head Base -->
  <ellipse cx="400" cy="430" rx="125" ry="165" fill="#FAF3E1"/>
  
  <!-- Modern Hair Silhouette -->
  <path d="M 270 410 C 270 270, 320 220, 400 220 C 490 220, 530 280, 530 410 C 530 350, 500 280, 400 270 C 330 280, 280 340, 270 410 Z" fill="#222222"/>

  <!-- Contemporary Glasses Frames in Safety Orange -->
  <g stroke="#FF6D1F" stroke-width="6" fill="none">
    <!-- Left Lens Frame -->
    <rect x="300" y="380" width="85" height="65" rx="12"/>
    <!-- Right Lens Frame -->
    <rect x="415" y="380" width="85" height="65" rx="12"/>
    <!-- Bridge -->
    <line x1="385" y1="405" x2="415" y2="405" stroke-width="5"/>
    <!-- Temples -->
    <line x1="300" y1="400" x2="275" y2="395" stroke-width="4"/>
    <line x1="500" y1="400" x2="525" y2="395" stroke-width="4"/>
  </g>

  <!-- Glasses Glare Highlights -->
  <line x1="320" y1="395" x2="365" y2="435" stroke="#FAF3E1" stroke-width="2.5" opacity="0.6"/>
  <line x1="435" y1="395" x2="480" y2="435" stroke="#FAF3E1" stroke-width="2.5" opacity="0.6"/>

  <!-- Minimalist Facial Features -->
  <path d="M 395 440 L 400 480 L 415 480" stroke="#222222" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 365 525 Q 400 545 435 525" stroke="#FF6D1F" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Graphic Accents & Technical Stamps -->
  <g transform="translate(60, 80)">
    <rect width="140" height="30" rx="15" fill="#FF6D1F"/>
    <text x="70" y="19" font-family="'DM Mono', monospace" font-size="11" font-weight="bold" fill="#FAF3E1" text-anchor="middle">AK. PORTRAIT</text>
  </g>

  <g transform="translate(600, 80)">
    <text x="140" y="20" font-family="'DM Mono', monospace" font-size="12" fill="#FAF3E1" opacity="0.6" text-anchor="end">№ 001 // DOSSIER</text>
  </g>

  <!-- Crosshair Focus Reticles -->
  <g stroke="#FF6D1F" stroke-width="1.5" opacity="0.7">
    <circle cx="400" cy="430" r="30" fill="none" stroke-dasharray="4 4"/>
    <line x1="390" y1="430" x2="410" y2="430"/>
    <line x1="400" y1="420" x2="400" y2="440"/>
  </g>

  <!-- Bottom Archival Stamp -->
  <rect x="0" y="920" width="800" height="80" fill="#222222"/>
  <text x="60" y="965" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#FAF3E1">
    AKASH KUNDU
  </text>
  <text x="740" y="965" font-family="'DM Mono', monospace" font-size="12" fill="#FF6D1F" text-anchor="end" font-weight="bold">
    CSE STUDENT × CREATIVE DIRECTOR
  </text>
</svg>
