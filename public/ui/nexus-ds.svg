<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#222222"/>

  <!-- Top System Bar -->
  <rect x="80" y="80" width="1040" height="50" rx="8" fill="#FAF3E1" opacity="0.08"/>
  <circle cx="120" cy="105" r="7" fill="#FF6D1F"/>
  <circle cx="145" cy="105" r="7" fill="#F5E7C6" opacity="0.4"/>
  <circle cx="170" cy="105" r="7" fill="#FAF3E1" opacity="0.2"/>
  <text x="210" y="110" font-family="'DM Mono', monospace" font-size="13" fill="#FAF3E1" opacity="0.7">nexus-design-system / tokens / v2.4-stable</text>

  <!-- Typography Header -->
  <text x="80" y="220" font-family="'Outfit', sans-serif" font-weight="900" font-size="64" fill="#FAF3E1">
    NEXUS UI SYSTEM<tspan fill="#FF6D1F">.</tspan>
  </text>
  <text x="80" y="270" font-family="'Geist', sans-serif" font-size="20" fill="#FAF3E1" opacity="0.75">
    Modular Design Token Architecture &amp; High-Density Component Matrix
  </text>

  <!-- Component Card 01: Buttons & Status -->
  <g transform="translate(80, 330)">
    <rect width="320" height="380" rx="12" fill="#FAF3E1"/>
    <text x="30" y="45" font-family="'DM Mono', monospace" font-size="12" fill="#FF6D1F" font-weight="bold">COMPONENT: BUTTON VARIANTS</text>
    
    <!-- Primary Button -->
    <rect x="30" y="80" width="260" height="48" rx="8" fill="#FF6D1F"/>
    <text x="160" y="110" font-family="'Outfit', sans-serif" font-weight="bold" font-size="14" fill="#FAF3E1" text-anchor="middle">PRIMARY ACTION</text>
    
    <!-- Secondary Button -->
    <rect x="30" y="145" width="260" height="48" rx="8" fill="#222222"/>
    <text x="160" y="175" font-family="'Outfit', sans-serif" font-weight="bold" font-size="14" fill="#FAF3E1" text-anchor="middle">SECONDARY DARK</text>

    <!-- Outlined Button -->
    <rect x="30" y="210" width="260" height="48" rx="8" fill="none" stroke="#222222" stroke-width="2"/>
    <text x="160" y="240" font-family="'Outfit', sans-serif" font-weight="bold" font-size="14" fill="#222222" text-anchor="middle">GHOST OUTLINE</text>

    <!-- Status badges -->
    <g transform="translate(30, 290)">
      <rect width="80" height="28" rx="14" fill="#FF6D1F" opacity="0.2"/>
      <text x="40" y="18" font-family="'DM Mono', monospace" font-size="10" fill="#FF6D1F" font-weight="bold" text-anchor="middle">ACTIVE</text>

      <rect x="90" width="80" height="28" rx="14" fill="#222222" opacity="0.1"/>
      <text x="130" y="18" font-family="'DM Mono', monospace" font-size="10" fill="#222222" text-anchor="middle">PENDING</text>
    </g>
  </g>

  <!-- Component Card 02: Code Editor Dock -->
  <g transform="translate(440, 330)">
    <rect width="680" height="380" rx="12" fill="#F5E7C6"/>
    <text x="30" y="45" font-family="'DM Mono', monospace" font-size="12" fill="#222222" font-weight="bold">TOKEN ARCHITECTURE // CSS VARIABLES</text>

    <rect x="30" y="70" width="620" height="270" rx="8" fill="#222222"/>
    <g font-family="'DM Mono', monospace" font-size="13" fill="#FAF3E1" transform="translate(55, 110)">
      <text y="0"><tspan fill="#FF6D1F">:root</tspan> &#123;</text>
      <text y="28" fill="#FAF3E1" opacity="0.9">  --bg-primary: <tspan fill="#FF6D1F">#FAF3E1</tspan>;</text>
      <text y="56" fill="#FAF3E1" opacity="0.9">  --bg-surface: <tspan fill="#FF6D1F">#F5E7C6</tspan>;</text>
      <text y="84" fill="#FAF3E1" opacity="0.9">  --accent-blaze: <tspan fill="#FF6D1F">#FF6D1F</tspan>;</text>
      <text y="112" fill="#FAF3E1" opacity="0.9">  --dark-carbon: <tspan fill="#FF6D1F">#222222</tspan>;</text>
      <text y="140" fill="#FAF3E1" opacity="0.5">  /* Typography scale */</text>
      <text y="168" fill="#FAF3E1" opacity="0.9">  --font-display: <tspan fill="#FAF3E1">'Outfit'</tspan>, sans-serif;</text>
      <text y="196">&#125;</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <text x="80" y="780" font-family="'DM Mono', monospace" font-size="13" fill="#FAF3E1" opacity="0.6">
    DESIGN SYSTEM DESIGNED FOR 5 ENGINEERING CLUBS &amp; 140+ PRODUCTION COMPONENTS
  </text>
</svg>
